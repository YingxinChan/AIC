name: Daily weather summary email

# Separate from weather-check.yml's every-3-hours swap check — this sends
# one AI-generated weather summary per ongoing trip, once a day. Fixed 9am
# UTC for every trip regardless of destination: neither Trip nor User has a
# timezone field today, so trip-local time would need a schema migration —
# not worth it for the 25-city Europe-only MVP (UTC to UTC+3, so at most a
# few hours of local drift from a "real" 9am).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  daily-weather-summary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/send_daily_weather_summary.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRONTEND_URL: https://climago30.netlify.app
